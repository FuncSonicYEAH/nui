[package]
name = "nui-render"
description = "nui renderer: wgpu scene graph and rect/text/image pipelines"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
nui-core.workspace = true
nui-runtime.workspace = true
nui-text.workspace = true
wgpu = "30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[lints]
workspace = true

[dev-dependencies]
pollster = "0.4"
nui-layout.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
